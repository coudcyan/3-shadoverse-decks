<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>シャドバ身内大会 デッキリスト</title>
　<style>
    /* 全体の設定 */
    body { 
        font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; /* フォント設定 */
        margin: 0;
        background-color: #f0f0f5; /* ページの背景色を薄いグレーに */
        color: #333; /* 文字の色を濃いグレーに */
        line-height: 1.6;
    }

    /* ヘッダー（ページ上部の見出し） */
    h1 {
        background-color: #4a7abf; /* 大会タイトル部分の背景色（シャドバのイメージカラーに近く） */
        color: white; /* 文字を白に */
        padding: 20px 40px;
        text-align: center;
        margin-bottom: 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* 影をつけて立体感を出す */
    }

    /* メインコンテンツの幅を調整 */
    .container {
        width: 90%;
        max-width: 1000px;
        margin: 0 auto; /* 画面中央に配置 */
    }

    /* デッキごとの枠（カードのようなデザインに） */
    .deck-container { 
        margin-bottom: 30px; 
        border: none; /* 従来の線を消す */
        background-color: white; /* デッキ枠の背景を白に */
        padding: 20px; 
        border-radius: 10px; /* 角を丸くする */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15); /* 影で浮き上がって見えるようにする */
    }

    /* 参加者名・クラス名の見出し */
    h2 { 
        border-bottom: 3px solid #e75a7c; /* 下線にアクセントカラーを使う */
        padding-bottom: 5px; 
        color: #e75a7c;
        font-size: 1.5em;
    }

    /* デッキ画像 */
    .deck-image { 
        max-width: 100%; 
        height: auto; 
        display: block; 
        margin-top: 15px; 
        border: 1px solid #ddd; /* 画像の周りに細い枠線 */
        border-radius: 5px;
    }
　</style>
</head>
<body>

    <h1>シャドウバース身内大会 デッキリスト公開</h1>
　　<div class="container"> <p>参加者の使用デッキ画像はこちらからご確認ください。</p>

    <div class="deck-container">
        <h2>ぱとたっく - ネメシス</h2>
        <img src="ぱとA.png" alt="ぱとたっくのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>ぱとたっく - ナイトメア</h2>
        <img src="ぱとB.png" alt="ぱとたっくのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>かしぇ - ナイトメア</h2>
        <img src="かしぇA.png" alt="かしぇのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>かしぇ - ビショップ</h2>
        <img src="かしぇB.png" alt="かしぇのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>くらいん - ロイヤル</h2>
        <img src="くらいんA.png" alt="くらいんのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>くらいん - ネメシス</h2>
        <img src="くらいんB.png" alt="くらいんのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>あいす - ウィッチ</h2>
        <img src="あいすA.png" alt="あいすのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>あいす - エルフ</h2>
        <img src="あいすB.png" alt="あいすのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>くーど - ナイトメア</h2>
        <img src="くーどA.png" alt="くーどのデッキ画像" class="deck-image">
    </div>

    <div class="deck-container">
        <h2>くーど - ウィッチ</h2>
        <img src="くーどB.png" alt="くーどのデッキ画像" class="deck-image">
    </div>


    </body>
</html>
